version: 2

# Dependency policy (one batched, quiet, safe stream — not a PR per package):
# - ONE weekly window (Mon 06:00 NPT). Routine bumps are grouped into a single PR
#   per ecosystem; majors stay separate because they need a human migration.
# - Cooldown: a release must be N days old before we take it. Most malicious npm
#   releases (account takeovers, worm-style publishes) are pulled within days, so
#   waiting is cheap supply-chain protection. Security updates bypass cooldown.
# - Security fixes for a DIRECT dep arrive as one grouped PR. TRANSITIVE vulns
#   that Dependabot can't bump (parent pins the range → "security_update_not_possible",
#   which shows up as a red run on main) are fixed by us with a same-major
#   `pnpm.overrides` entry (root or landing package.json). CI's diff-aware
#   OSV-Scanner gate (ci.yml → deps-audit) flags any PR that introduces one.
# - landing/ is its OWN pnpm workspace (landing/pnpm-workspace.yaml). Without that
#   file pnpm walked up to the monorepo root, so Dependabot bumped
#   landing/package.json but never landing/pnpm-lock.yaml → frozen installs failed.
# - Patch/minor PRs auto-merge once the required `ci-ok` check passes
#   (dependabot-auto-merge.yml). npm majors are not opened at all: they are listed
#   on the weekly dependency dashboard issue and upgraded deliberately.
updates:
  - package-ecosystem: npm
    directories: ['/', '/landing']
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kathmandu
    open-pull-requests-limit: 5
    labels: ['type: chore']
    commit-message:
      prefix: 'deps'
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
      minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # MAJOR bumps are planned migrations (run-time verified, one PR each), not bot
      # PRs: they used to sit red, re-run full CI on every rebase, and pile up. The
      # weekly dependency dashboard (deps-dashboard.yml) lists every available major
      # AND runs a full OSV scan, because `ignore` also suppresses security updates
      # (a vuln only fixable by a major would otherwise go unseen).
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # @types/node MUST track the Node major we actually run (Node 20).
      - dependency-name: '@types/node'
        versions: ['>=21']
      # 0.x packages whose "minors" are breaking: bump deliberately.
      # pdfmake 0.2 API is hand-tuned in the reports renderer.
      - dependency-name: 'pdfmake'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'drizzle-kit'
        update-types: ['version-update:semver-minor']
      # Beta Managed Agents SDK: 0.105 -> 0.128 removed BetaSkill.display_title and
      # broke typecheck. Upgrade alongside a re-verified agent, never in the group.
      - dependency-name: '@anthropic-ai/sdk'
        update-types: ['version-update:semver-minor']

  # GitHub Actions: one grouped PR a week (security + Node runtime deprecations).
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kathmandu
    open-pull-requests-limit: 2
    labels: ['type: chore', 'type: security']
    commit-message:
      prefix: 'ci'
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
