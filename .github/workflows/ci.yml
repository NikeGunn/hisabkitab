name: CI

# Change-aware PR gate with ONE required check (`ci-ok`).
#
# - `changes` decides which parts of the repo a PR touched; each job runs only when
#   its inputs changed (a landing-only PR never boots Postgres; a backend-only PR never
#   builds the website). Editing this workflow runs everything.
# - `ci-ok` aggregates every job: it fails if any job failed or was cancelled and
#   passes when the rest succeeded or were skipped as irrelevant. Branch protection
#   requires ONLY `ci-ok`, so adding/renaming/matrixing jobs never strands a PR on a
#   "required check expected" that will never report.
# - Branch protection is strict + squash merges, so main receives exactly the tree a
#   PR run verified; the push to main runs only `scan` (Security tab tracks main).
# - Run everything on demand: Actions → CI → Run workflow (any branch).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── which parts changed? (workflow_dispatch = everything) ──
  changes:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.all.outputs.run || steps.filter.outputs.backend }}
      landing: ${{ steps.all.outputs.run || steps.filter.outputs.landing }}
    steps:
      - id: all
        if: github.event_name == 'workflow_dispatch'
        run: echo "run=true" >> "$GITHUB_OUTPUT"
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'packages/**'
              - 'agents-learning/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'eslint.config.*'
              - '.prettierrc*'
              - 'Dockerfile'
              - '.dockerignore'
              - 'compose*.yaml'
              - 'infra/**'
              - '.github/scripts/**'
              - '.github/workflows/ci.yml'
            landing:
              - 'landing/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/landing-pages.yml'

  # ── quality gate: typecheck + lint + the full vitest suite against real PG+Redis ──
  test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # The vitest global-setups read these; they DROP+migrate the test DB themselves.
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hisabkitab_test
      TEST_DATABASE_URL: postgres://hisab_app:hisab_app_dev@localhost:5432/hisabkitab_test
      TEST_ORCH_DATABASE_URL: postgres://hisab_orch:hisab_orch_dev@localhost:5432/hisabkitab_test
      # Rehearsal Lab durable-runner + isolation tests (least-privilege lab role).
      LAB_TEST_DATABASE_URL: postgres://hisab_lab:hisab_lab_dev@localhost:5432/hisabkitab_test
      LAB_TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hisabkitab_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with: { version: 10.14.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # Create the test DB + the two least-privilege RLS roles the suite expects.
      - name: Provision test database + roles
        run: |
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE hisabkitab_test;
          DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='hisab_app') THEN
              CREATE ROLE hisab_app LOGIN PASSWORD 'hisab_app_dev' NOSUPERUSER NOBYPASSRLS;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='hisab_orch') THEN
              CREATE ROLE hisab_orch LOGIN PASSWORD 'hisab_orch_dev' NOSUPERUSER NOBYPASSRLS;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='hisab_lab') THEN
              CREATE ROLE hisab_lab LOGIN PASSWORD 'hisab_lab_dev' NOSUPERUSER NOBYPASSRLS;
            END IF;
          END $$;
          GRANT CONNECT ON DATABASE hisabkitab_test TO hisab_app, hisab_orch, hisab_lab;
          SQL

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (sequential, shared test DB)
        run: pnpm test

      # Agent safety regression gate ($0, deterministic): the committed learned policy
      # must keep ZERO hard violations on the held-out test split, and the reference
      # policies must stay at 100%. A change to the env, judge or harness that breaks
      # this fails the PR before any human looks at it.
      - name: Rehearsal Lab regression gate
        working-directory: agents-learning
        run: |
          pnpm lab eval --agent careful --split all
          pnpm lab eval --agent policy:rules --split all
          pnpm lab eval --agent policy:research/weights/grpo-v1_judge-seed0.json --split test
          node -e "
            const r = (f) => require('./reports/' + f);
            const bad = [];
            for (const f of ['careful-all.json', 'policy_rules-all.json']) if (r(f).pass_rate !== 1) bad.push(f + ' pass_rate ' + r(f).pass_rate);
            const p = r('policy_research_weights_grpo-v1_judge-seed0.json-test.json');
            if (p.hard_violations !== 0) bad.push('learned policy has ' + p.hard_violations + ' hard violations on test');
            if (bad.length) { console.error(bad.join('
')); process.exit(1); }
            console.log('regression gate PASS');"

  # ── research layer (Python + numpy): gradient checks, stats, GRPO on a known bandit ──
  research:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agents-learning/research
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install 'numpy>=2' pytest
      - run: python -m pytest -q

  # ── build all service images (no push); proves the Dockerfile is green ──
  docker-build:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [orchestrator, mcp-ledger, mcp-payments, mcp-tally, rehearsal]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          build-args: SERVICE=${{ matrix.service }}
          tags: hisab-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Smoke: the image must boot and answer /healthz (catches isDirectRun-style bugs).
      - name: Smoke test ${{ matrix.service }} boots and serves /healthz
        if: matrix.service != 'orchestrator'
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e LEDGER_MCP_TOKEN=ci -e PAYMENTS_MCP_TOKEN=ci -e TALLY_MCP_TOKEN=ci \
            -e TENANT_SIGNING_SECRET=ci-secret-123 \
            -e DATABASE_URL=postgres://x:y@localhost:5432/z \
            -e CALLBACK_DATABASE_URL=postgres://x:y@localhost:5432/z \
            -e CONNECTOR_DATABASE_URL=postgres://x:y@localhost:5432/z \
            -e KHALTI_SECRET_KEY=ci hisab-${{ matrix.service }}:ci
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8080/healthz; then echo " OK"; exit 0; fi
            sleep 1
          done
          echo "healthz never came up"; docker logs smoke; exit 1

  # ── landing: own pnpm workspace + lockfile; must install frozen and build ──
  # Fonts are self-hosted (next/font/local), so the build needs no network.
  landing:
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.14.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: pnpm, cache-dependency-path: landing/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # ── deps-audit: block a PR that INTRODUCES a known vuln (root + landing lockfiles) ──
  # Google OSV-Scanner reads OSV, which includes the GitHub advisory DB (the same data
  # behind Dependabot alerts; `pnpm audit` uses npm's feed and missed landing vulns).
  # Diff-aware: it scans base vs head and fails only on vulns this PR adds, so a
  # freshly published advisory never turns unrelated PRs red. Vulns already on main
  # are tracked by the weekly dependency dashboard (deps-dashboard.yml).
  deps-audit:
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.6.0
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      upload-sarif: false

  # ── the ONE required check: green iff nothing that ran failed ──
  ci-ok:
    if: always() && github.event_name != 'push'
    needs: [changes, test, research, docker-build, landing, deps-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs succeeded or were skipped as unaffected
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
          if [ -n "$bad" ]; then echo "::error title=CI failed::$bad"; exit 1; fi
          # `changes` decides what runs; if it did not succeed nothing was verified.
          if [ "$(echo "$NEEDS" | jq -r '.changes.result')" != "success" ]; then
            echo "::error title=CI failed::change detection did not succeed"; exit 1
          fi

  # ── security: filesystem + dependency vulnerability scan (advisory) ──
  # Marked continue-on-error: the Trivy binary install / DB download is
  # occasionally flaky on the runner (GitHub API rate limits), and an advisory
  # scan must not red-X the whole pipeline on tooling hiccups. Findings still
  # surface in the Security tab when the scan runs.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # Pull the vuln DB from GHCR via the token to dodge anonymous rate limits.
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
      - name: Upload results to code scanning
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
        continue-on-error: true # code scanning may be off on private repos without GHAS
